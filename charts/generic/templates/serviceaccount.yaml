{{- define "generic.serviceAccount" }}
{{- with .Values.serviceAccount.annotations }}
metadata:
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- with .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}

{{- if .Values.serviceAccount.create }}
{{- include "common.service_account" (list . "generic.serviceAccount") }}
{{- end }}
